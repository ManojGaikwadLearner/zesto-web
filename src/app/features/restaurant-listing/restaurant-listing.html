<div class="restaurant-grid">
    @for (restaurant of restaurants(); track restaurant.id) {
      <div class="restaurant-card">
        <div class="restaurant-image">
            <img [src]="'assets/restaurant-pics/' + restaurant.id + '.jpg'"
                    [alt]="restaurant.name" width="320" height="240" loading="lazy" decoding="async" />
        </div>
        <div class="restaurant-details">
            <h3 class="restaurant-name">{{ restaurant.name }}</h3>
            <div class="restaurant-rating">
                <span class="rating"><i class="fa fa-star" aria-hidden="true"></i>{{ rating }}</span>
                <span class="rating-count">{{ ratingCount }}+ ratings</span>
            </div>
            <button class="order-btn" (click)="onOrder(restaurant.id)">Order Now</button>
        </div>
      </div>
    }
</div>
